services:
  db:
    image: postgres:16
    container_name: motherschat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: motherschat
      POSTGRES_PASSWORD: motherschat_password
      POSTGRES_DB: motherschat
    ports:
      - "5432:5432"
    volumes:
      - motherschat_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motherschat_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # DATABASE_URL можно переопределить через окружение хоста или .env (автоматически читается)
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://motherschat:motherschat_password@db:5432/motherschat}"
      # Ключ OpenAI (передается через окружение хоста или .env, если есть)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Токен Telegram бота (передается через окружение хоста или .env, если есть)
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      # Модель по умолчанию (можно переопределить)
      DEFAULT_MODEL: "${DEFAULT_MODEL:-gpt-4.1-mini}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-https://mamino.online}"
      DEFAULT_DAILY_REQUESTS: "${DEFAULT_DAILY_REQUESTS:-30}"
      DEFAULT_MONTHLY_REQUESTS: "${DEFAULT_MONTHLY_REQUESTS:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-120}"
      # Включить тестовый фейковый OpenAI: 1 — включено (dev/CI), 0 — выключено (prod)
      ENABLE_FAKE_OPENAI: "${ENABLE_FAKE_OPENAI:-0}"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  motherschat_db_data:
